# Example GitHub Actions workflow for using the provider with OIDC authentication
name: Terraform Apply with OIDC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC token
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Get OIDC Token
        id: oidc
        run: |
          # GitHub Actions automatically provides OIDC token via ACTIONS_ID_TOKEN_REQUEST_URL
          # The Azure provider will handle this automatically
          echo "OIDC token will be requested automatically"

      - name: Terraform Init
        run: terraform init
        env:
          # Authentication via OIDC/Workload Identity Federation
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_USE_OIDC: true
          # The provider will automatically get the OIDC token from GitHub Actions

      - name: Terraform Plan
        run: terraform plan
        env:
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_USE_OIDC: true

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve
        env:
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_USE_OIDC: true
